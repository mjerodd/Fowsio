{% extends 'base.html' %}

{% load static %}

    {% block content %}


<div class="col-span-6">


    <main class="px-16 py-6 bg-gray-200 border-4 border-white shadow-xl">
        <div class="flex justify-end">
            <a href="{% url 'login' %}">Login</a>
            <a class="ml-3" href="{% url 'register' %}">Sign Up</a>
        </div>
        <header class="flex justify-items">

            <h2 class="text-white text-6xl font-semibold"></h2>



        </header>

        <div class="shadow-lg text-black px-1 bg-white border-4 border-sky-400 rounded-lg px-16 py-6 mt-8">

            <div class="text-center mb-6">
                <h2 class="text-3xl pb-4">Post FW Upgrade Reports</h2>
            </div>

          {% for report in reports %}


            <a href="{% url 'download-report' report %}"><p>{{ report }}</p></a>
          {% endfor %}

            <br>


        </div>
        </main>
        </div>

{% endblock %}
